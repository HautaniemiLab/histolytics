[project]
name = "histolytics"
version = "0.3.0"
description = "Panoptic Segmentation and WSI Spatial Analysis"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Oskari Lehtonen", email = "oskari.lehtonen@helsinki.fi" }
]
keywords = ["panoptic segmentation", "whole slide image", "spatial analysis", "geospatial", "computer vision"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "esda>=2.7.0",
    "geopandas>=1.0.1,<2.0.0",
    "h3>=4.2.2",
    "libpysal>=4.13.0,<5.0.0",
    "mapclassify>=2.8.1",
    "matplotlib>=3.10.3",
    "networkx>=3.4.2",
    "numba>=0.60.0,<0.61.0",
    "numpy>=1.24.4,<2.0",
    "opencv-python>=4.8,<5.0",
    "pandarallel>=1.6.5",
    "pandas>=2.0,<2.4.0dev0",
    "psutil",
    "pyarrow>=16.1.0,<17.0.0",
    "pyproj>=3.3.0",
    "quadbin>=0.2.2",
    "rasterio>=1.4.3,<2.0.0",
    "scikit-image>=0.25.0,<0.26",
    "scikit-learn>=1.4,<2.0.0",
    "scipy>=1.14,<2.0",
    "shapely>=2.0.1",
    "tqdm>=4.64.0,<5.0.0",
]

[project.optional-dependencies]
all = ["histolytics[segmentation,cucim,cuda-analysis]"]
segmentation = [
    "albumentations>=2.0.6",
    "cellseg-models-pytorch>=0.1.30",
    "datasets>=3.6.0",
    "huggingface-hub",
    "pillow>=10.1",
    "safetensors",
    "torch>=2.9.1,<3.0",
    "torchdata>=0.11.0",
]
cucim = [
    "histolytics[segmentation]",
    "cucim-cu12>=25.6.0",
    "cupy-cuda12x>=12.0.0",
]
cuda-analysis = [
    "cucim-cu12>=25.6.0",
    "cuml-cu12>=25.6.0",
    "cupy-cuda12x>=12.0.0",
]

[project.urls]
Homepage = "https://hautaniemilab.github.io/histolytics/"
Documentation = "https://hautaniemilab.github.io/histolytics/"
Repository = "https://github.com/HautaniemiLab/histolytics"
Changelog = "https://github.com/HautaniemiLab/histolytics/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff==0.17.0",
]
docs = [
    "griffe-inherited-docstrings>=1.1.1",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material[imaging]>=9.6.12",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
    "pymdown-extensions>=10.15",
]

wsi-tests = [
    "openslide-bin>=4.0",
    "openslide-python>=1.4",
    "tifffile>=2025.5.10",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/histolytics",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    ".python-version",
    "pyproject.toml",
    "uv.lock",
]
