name: Validate distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.4"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release versions and test guards
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/check_release_metadata.py
          python -m unittest discover -s tools/tests -v
      - name: Build and check distributions
        run: |
          uv build
          uvx --from twine==7.0.0 twine check --strict dist/*
          python tools/check_distributions.py
      - uses: actions/upload-artifact@v7
        with:
          name: package-distributions
          path: dist/*
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        distribution: [wheel, sdist]
    env:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.4"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: package-distributions
          path: dist
      - name: Install the built distribution with declared dependencies
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/package-env"
          if [ "$DISTRIBUTION" = wheel ]; then
            uv pip install --python "$RUNNER_TEMP/package-env/bin/python" dist/*.whl
          else
            uv pip install --python "$RUNNER_TEMP/package-env/bin/python" dist/*.tar.gz
          fi
          uv pip check --python "$RUNNER_TEMP/package-env/bin/python"
      - name: Check installed imports, sample data, spatial queries, and CPU training
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/package-env/bin/python" "$GITHUB_WORKSPACE/tools/check_installed_package.py"'
