name: Validate distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.4"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release versions and test guards
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/check_release_metadata.py
          python -m unittest discover -s tools/tests -v
      - name: Build and check distributions
        run: |
          uv build
          uvx --from twine==7.0.0 twine check --strict dist/*
          python tools/check_distributions.py
      - uses: actions/upload-artifact@v7
        with:
          name: package-distributions
          path: dist/*
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        distribution: [wheel, sdist]
        profile: [analysis, full]
        os: [ubuntu-latest]
        include:
          - {python-version: "3.12", distribution: wheel, profile: analysis, os: macos-latest}
          - {python-version: "3.12", distribution: sdist, profile: analysis, os: macos-latest}
          - {python-version: "3.12", distribution: wheel, profile: cuda-analysis, os: ubuntu-latest}
          - {python-version: "3.12", distribution: sdist, profile: cuda-analysis, os: ubuntu-latest}
          - {python-version: "3.12", distribution: wheel, profile: segmentation, os: ubuntu-latest}
          - {python-version: "3.12", distribution: sdist, profile: segmentation, os: ubuntu-latest}
          - {python-version: "3.12", distribution: wheel, profile: segmentation, os: macos-latest}
          - {python-version: "3.12", distribution: sdist, profile: segmentation, os: macos-latest}
    env:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.4"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: package-distributions
          path: dist
      - name: Install the built distribution with declared dependencies
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          PROFILE: ${{ matrix.profile }}
        run: |
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/package-env"
          if [ "$PROFILE" = full ]; then
            extras="all"
          elif [ "$PROFILE" = segmentation ]; then
            extras="segmentation"
          elif [ "$PROFILE" = cuda-analysis ]; then
            extras="cuda-analysis"
          else
            extras=""
          fi
          if [ "$DISTRIBUTION" = wheel ]; then
            artifact=$(find dist -name '*.whl' -print -quit)
          else
            artifact=$(find dist -name '*.tar.gz' -print -quit)
          fi
          if [ -n "$extras" ]; then
            artifact="$artifact[$extras]"
          fi
          uv pip install --python "$RUNNER_TEMP/package-env/bin/python" "$artifact"
          uv pip check --python "$RUNNER_TEMP/package-env/bin/python"
      - name: Check installed capability profile outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/package-env/bin/python" "$GITHUB_WORKSPACE/tools/check_installed_package.py" --profile "${{ matrix.profile }}"'
      - name: Exercise analysis regressions without the model stack
        if: matrix.profile == 'analysis'
        working-directory: ${{ runner.temp }}
        run: |
          uv pip install --python "$RUNNER_TEMP/package-env/bin/python" 'pytest>=8.3.5'
          "$RUNNER_TEMP/package-env/bin/python" -m pytest "$GITHUB_WORKSPACE/tests" --ignore="$GITHUB_WORKSPACE/tests/test_models.py" --ignore="$GITHUB_WORKSPACE/tests/test_postprocessing.py" -k 'not bundled_pixels_match_upstream'
