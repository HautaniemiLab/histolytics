name: Deploy Docs

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
            python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.4"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

        # Step 4: Install dependencies using UV
      - name: Install deps
        run: uv sync --locked --group docs --python "3.12"

      - name: Deploy Docs
        run: uv run --no-sync mkdocs gh-deploy --force
