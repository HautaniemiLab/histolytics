name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.4"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked development tools without runtime dependencies
        run: uv sync --locked --only-group dev --python "3.12"
      - name: Check lint and formatting
        run: |
          uv run --no-sync ruff check src tests tools
          uv run --no-sync ruff format --check src tests tools
      - name: Check release guard tests
        run: uv run --no-sync python -m unittest discover -s tools/tests -v

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies and current package
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"
      - name: Run tests and preserve coverage
        run: uv run --no-sync pytest tests --junitxml=test-results.xml --cov=histolytics --cov-report=xml
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn

  packages:
    uses: ./.github/workflows/package.yml
