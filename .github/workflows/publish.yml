name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: validate
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/histolytics/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-distributions
          path: dist
      - name: Publish validated distributions with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
